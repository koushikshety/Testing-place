<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Donghua Stream</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0b1120; color: #e2e8f0; padding: 14px; max-width: 960px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h1 { font-size: 1.2rem; color: #38bdf8; }
    .badge { font-size: 0.72rem; background: #1e293b; color: #38bdf8; padding: 4px 8px; border-radius: 6px; border: 1px solid #334155; }
    .player-box { background: #020617; border-radius: 10px; overflow: hidden; border: 1px solid #1e293b; }
    .stage { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
    .stage iframe, .stage video { width: 100%; height: 100%; border: 0; display: none; }
    .stage .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.9rem; }
    .bar { padding: 10px 12px; background: #0f172a; border-top: 1px solid #1e293b; }
    .now-playing { font-size: 0.88rem; color: #f8fafc; margin-bottom: 8px; }
    .servers { display: flex; gap: 6px; flex-wrap: wrap; }
    .srv-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #cbd5e1; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .srv-btn.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 10px; }
    .tab { padding: 6px 12px; border-radius: 999px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; font-size: 0.8rem; cursor: pointer; }
    .tab.active { background: #38bdf8; color: #020617; border-color: #38bdf8; font-weight: 700; }
    .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
    .ep-card { background: #1e293b; padding: 10px 12px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.15s; }
    .ep-card:hover, .ep-card.active { border-color: #38bdf8; background: #172554; }
    .ep-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .ep-series { font-size: 0.72rem; color: #38bdf8; font-weight: 700; text-transform: uppercase; }
    .ep-num { font-size: 0.72rem; background: #0f172a; padding: 2px 6px; border-radius: 4px; color: #cbd5e1; }
    .ep-title { font-size: 0.84rem; color: #f1f5f9; line-height: 1.3; }
    .ep-meta { font-size: 0.72rem; color: #94a3b8; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>Donghua Auto-Stream</h1>
    <span class="badge" id="countBadge">Loading...</span>
  </header>

  <div class="player-box">
    <div class="stage">
      <div class="placeholder" id="placeholder">Select an episode below to start watching</div>
      <iframe id="embedPlayer" allowfullscreen allow="autoplay; fullscreen"></iframe>
      <video id="hlsPlayer" controls playsinline></video>
    </div>
    <div class="bar">
      <div class="now-playing" id="nowPlaying">Auto-synced via GitHub Actions</div>
      <div class="servers" id="serverBar"></div>
    </div>
  </div>

  <div class="tabs" id="seriesTabs"></div>
  <div class="ep-grid" id="epGrid">Loading catalog...</div>

  <script>
    const WORKER = "https://hls-cors-proxy.aniguide-hub.workers.dev/?url=";
    const iframe = document.getElementById("embedPlayer");
    const video = document.getElementById("hlsPlayer");
    const placeholder = document.getElementById("placeholder");
    let hls = null;
    let catalog = [];
    let activeSeries = "All";

    function playServer(srv, title, btnEl) {
      document.querySelectorAll(".srv-btn").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");

      placeholder.style.display = "none";
      document.getElementById("nowPlaying").textContent = `${title} — [${srv.name}]`;

      if (hls) { hls.destroy(); hls = null; }
      video.pause();
      video.removeAttribute("src");
      iframe.src = "";

      if (srv.type === "hls" || srv.url.includes(".m3u8")) {
        iframe.style.display = "none";
        video.style.display = "block";
        const proxied = WORKER + encodeURIComponent(srv.url);
        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(proxied);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
          video.src = proxied;
          video.play().catch(() => {});
        }
      } else {
        video.style.display = "none";
        iframe.style.display = "block";
        iframe.src = srv.url;
      }
    }

    function selectEpisode(ep, cardEl) {
      document.querySelectorAll(".ep-card").forEach(c => c.classList.remove("active"));
      if (cardEl) cardEl.classList.add("active");

      const bar = document.getElementById("serverBar");
      bar.innerHTML = "";

      ep.servers.forEach((srv, i) => {
        const btn = document.createElement("button");
        btn.className = "srv-btn";
        btn.textContent = `Server ${i + 1}: ${srv.name}`;
        btn.onclick = () => playServer(srv, ep.title, btn);
        bar.appendChild(btn);
        if (i === 0) playServer(srv, ep.title, btn);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderGrid() {
      const grid = document.getElementById("epGrid");
      const filtered = activeSeries === "All"
        ? catalog
        : catalog.filter(ep => ep.series === activeSeries);

      grid.innerHTML = "";
      filtered.forEach(ep => {
        const card = document.createElement("div");
        card.className = "ep-card";
        const srvNames = ep.servers.map(s => s.name).join(" • ");
        card.innerHTML = `
          <div class="ep-top">
            <span class="ep-series">${ep.series}</span>
            <span class="ep-num">EP ${ep.episode || "?"}</span>
          </div>
          <div class="ep-title">${ep.title}</div>
          <div class="ep-meta">${ep.servers.length} server(s): ${srvNames}</div>
        `;
        card.onclick = () => selectEpisode(ep, card);
        grid.appendChild(card);
      });
    }

    async function init() {
      try {
        const res = await fetch("./data/catalog.json?t=" + Date.now());
        catalog = await res.json();
        document.getElementById("countBadge").textContent = `${catalog.length} Episodes Live`;

        const seriesList = ["All", ...new Set(catalog.map(x => x.series))];
        const tabs = document.getElementById("seriesTabs");
        tabs.innerHTML = "";
        seriesList.forEach(s => {
          const btn = document.createElement("button");
          btn.className = "tab" + (s === "All" ? " active" : "");
          btn.textContent = s;
          btn.onclick = () => {
            activeSeries = s;
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            btn.classList.add("active");
            renderGrid();
          };
          tabs.appendChild(btn);
        });

        renderGrid();
        if (catalog.length) {
          const firstCard = document.querySelector(".ep-card");
          selectEpisode(catalog[0], firstCard);
        }
      } catch (e) {
        document.getElementById("epGrid").textContent = "Failed to load data/catalog.json";
      }
    }

    init();
  </script>
</body>
</html>
