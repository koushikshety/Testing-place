<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rumble Dummy Testing Place</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1115; color: #e4e6eb; padding: 16px; max-width: 820px; margin: auto; }
    .bar { display: flex; gap: 8px; margin-bottom: 14px; }
    input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333a48; background: #181b22; color: #fff; }
    button { padding: 10px 14px; border-radius: 6px; border: 0; background: #85c742; color: #0f1115; font-weight: 700; cursor: pointer; }
    .player-box { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 18px; }
    .player-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .card { background: #181b22; padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; cursor: pointer; border: 1px solid #282d38; }
    .card:hover { border-color: #85c742; }
  </style>
</head>
<body>
  <h2>Rumble Dummy Player</h2>

  <div class="bar">
    <input id="urlInput" type="text" placeholder="Paste Rumble embed URL (https://rumble.com/embed/...)" />
    <button onclick="loadManual()">Play</button>
  </div>

  <div id="playerBox" class="player-box">
    <iframe id="rumbleFrame" src="https://rumble.com/embed/v7gg4yg/?pub=4qowyg" allowfullscreen></iframe>
  </div>

  <h3>Catalog (from rumble_catalog.json)</h3>
  <div id="catalog">Loading catalog...</div>

  <script>
    function loadManual() {
      const val = document.getElementById('urlInput').value.trim();
      if (!val) return;
      document.getElementById('playerBox').innerHTML =
        `<iframe src="${val}" allowfullscreen></iframe>`;
    }

    async function loadCatalog() {
      const el = document.getElementById('catalog');
      try {
        const res = await fetch('./rumble_catalog.json');
        const items = await res.json();
        if (!items.length) {
          el.textContent = 'Catalog is empty. Add Rumble URLs to fetch_rumble.py and run it.';
          return;
        }
        el.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'card';
          div.textContent = item.title;
          div.onclick = () => {
            document.getElementById('playerBox').innerHTML = item.embed_html;
          };
          el.appendChild(div);
        });
      } catch {
        el.textContent = 'No rumble_catalog.json found yet. Use the URL box above to test any embed.';
      }
    }
    loadCatalog();
  </script>
</body>
</html>
